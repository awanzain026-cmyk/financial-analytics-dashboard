# Render blueprint — backend web service (FastAPI).
# Root directory must be backend/ because this repo also contains the Next.js frontend.
services:
  - type: web
    name: expense-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # set the Neon Postgres connection string in the Render dashboard
      - key: CORS_ORIGINS
        sync: false # comma-separated Vercel domain(s)
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
